<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ヒット＆ブロー オンライン</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

<!-- ===== ロビー画面 ===== -->
<div id="screen-lobby" class="screen">
  <div class="lobby-wrap">
    <h1 class="logo">🎯 ヒット＆ブロー</h1>
    <p class="logo-sub">オンライン対戦</p>
    <button class="btn primary big" id="create-btn">ルームを作成する</button>
    <div class="divider">または</div>
    <div class="join-row">
      <input id="join-input" class="join-input" type="text" placeholder="ルームID（6文字）" maxlength="6" autocomplete="off">
      <button class="btn primary" id="join-btn">参加</button>
    </div>
    <p id="lobby-error" class="error-msg"></p>
  </div>
</div>

<!-- ===== モード選択画面 ===== -->
<div id="screen-mode" class="screen hidden">
  <div class="lobby-wrap">
    <h2>🎮 モードを選ぼう</h2>
    <p class="hint-text">対戦のルールを選んでください</p>
    <button class="btn primary big" id="mode-normal-btn">通常モード<br><span class="mode-sub">時間制限なし</span></button>
    <button class="btn big" id="mode-timer-btn">⏱️ タイマーモード<br><span class="mode-sub">1ターンの時間制限あり</span></button>
  </div>
</div>

<!-- ===== タイマー秒数設定画面 ===== -->
<div id="screen-timer-config" class="screen hidden">
  <div class="lobby-wrap">
    <h2>⏱️ 制限時間を決めよう</h2>
    <p class="hint-text">1ターンあたりの制限時間（秒）</p>
    <div class="timer-config-box">
      <div class="timer-config-value" id="timer-config-value">30</div>
      <input type="range" id="timer-config-slider" class="timer-config-slider" min="1" max="60" step="1" value="30">
      <div class="timer-config-row">
        <input type="number" id="timer-config-number" class="timer-config-number" min="1" max="60" step="1" value="30">
        <span class="timer-config-unit">秒</span>
      </div>
    </div>
    <button class="btn primary big" id="timer-config-confirm-btn">この時間でルームを作成</button>
    <button class="btn" id="timer-config-back-btn">戻る</button>
  </div>
</div>

<!-- ===== 待機画面 ===== -->
<div id="screen-waiting" class="screen hidden">
  <div class="lobby-wrap">
    <h2>🔗 友達を招待しよう</h2>
    <p class="hint-text">ルームIDまたはURLを相手に送ってください</p>
    <div class="room-id-box" id="room-id-display"></div>
    <div class="url-box" id="share-url"></div>
    <div class="copy-btns">
      <button class="btn primary" id="copy-id-btn">ルームIDをコピー</button>
      <button class="btn" id="copy-btn">URLをコピー</button>
    </div>
    <p class="waiting-msg" id="waiting-msg">
      <span class="dot-anim">相手の参加を待っています</span>
    </p>
  </div>
</div>

<!-- ===== 先後選択画面（P1用：待機） ===== -->
<div id="screen-select-wait" class="screen hidden">
  <div class="lobby-wrap">
    <h2>⚔️ 順番を決めています</h2>
    <p class="hint-text">相手が先行・後攻を選んでいます</p>
    <p class="waiting-msg"><span class="dot-anim">しばらくお待ちください</span></p>
  </div>
</div>

<!-- ===== 先後選択画面（P2用：選択） ===== -->
<div id="screen-select" class="screen hidden">
  <div class="lobby-wrap">
    <h2>⚔️ 先行・後攻を選ぼう</h2>
    <p class="hint-text">あなたが選択します</p>
    <button class="btn primary big" id="select-first-btn">先行（1P）</button>
    <button class="btn big" id="select-second-btn">後攻（2P）</button>
  </div>
</div>

<!-- ===== ゲーム画面 ===== -->
<div id="screen-game" class="screen hidden">
  <div class="wrap">
    <div class="legend">
      <span><span class="ld hit"></span>ヒット：色と場所が正解</span>
      <span><span class="ld blow"></span>ブロー：色だけ正解</span>
      <button class="btn small" id="leave-btn">退出</button>
    </div>
    <div class="turn-bar">
      <span class="turn-chip" id="turn-chip">読み込み中...</span>
      <span class="timer-chip hidden" id="timer-chip">30</span>
    </div>
    <div class="board-area" id="board-area"></div>
    <div class="input-area" id="input-area">
      <div class="input-label" id="input-label">色を選んでください</div>
      <div class="palette-row" id="palette-row"></div>
      <div class="btns">
        <button class="btn primary" id="submit-btn" disabled>判定する</button>
        <button class="btn" id="clear-btn">クリア</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== 結果オーバーレイ ===== -->
<div class="result-overlay hidden" id="result-overlay">
  <div class="result-box">
    <h3 id="res-title"></h3>
    <p id="res-sub"></p>
    <div class="ans-preview" id="res-ans"></div>
    <button class="btn primary" id="rematch-btn">再戦する</button>
    <p class="rematch-waiting hidden" id="rematch-waiting">
      <span class="dot-anim">相手の返答を待っています</span>
    </p>
    <button class="btn" id="quit-btn">ロビーに戻る</button>
  </div>
</div>

<!-- トースト -->
<div class="toast" id="toast"></div>

<script type="module" src="./main.js"></script>
</body>
</html>
